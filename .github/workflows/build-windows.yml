name: Compilar Legacy Launcher para Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Crear ZIP e instalador
        run: npx electron-builder --win zip nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-Launcher-Windows
          path: |
            release/*.zip
            release/*Setup.exe
          if-no-files-found: error
