name: Compilar Legacy Launcher para Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verificar instalación del cliente oficial CEF
        timeout-minutes: 15
        run: |
          node -e "const fs=require('node:fs/promises'); const os=require('node:os'); const path=require('node:path'); const assert=require('node:assert/strict'); const {ensureCef}=require('./lib/cef.cjs'); (async()=>{const dir=await fs.mkdtemp(path.join(os.tmpdir(),'legacy-cef-ci-'));try{assert.equal((await ensureCef(dir,{onProgress:e=>console.log(e)})).installed,true);assert.equal((await ensureCef(dir,{fetchAsset:()=>{throw Error('Unexpected second download')}})).installed,false)}finally{await fs.rm(dir,{recursive:true,force:true,maxRetries:3})}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Crear ZIP e instalador
        run: npx electron-builder --win zip nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar manifiesto y paquete de actualización
        run: node scripts/verify-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-Launcher-Windows
          path: |
            release/*.zip
            release/*Setup.exe
            release/*Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: legacy-launcher-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: Legacy-Launcher-Windows
          path: release
      - name: Publicar versión estable si es nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid stable version' }
          $tag = "v$version"
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing releases' }
          if ($tags -contains $tag) { Write-Output "Release $tag already exists; not overwriting"; exit 0 }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name] | .[]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check latest version' }
          foreach ($old in $latest) {
            if ($old -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -ge [version]$version) { throw 'Refusing to publish an older version' }
          }
          $notes = "release-notes/$tag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw "Missing human-readable release notes: $notes" }
          $installer = "release/Legacy-Launcher-$version-Setup.exe"
          $zip = "release/Legacy-Launcher-$version-Windows-x64.zip"
          $files = @($installer, "$installer.blockmap", $zip, 'release/latest.yml')
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" } }
          gh release create $tag @files --draft --target $env:GITHUB_SHA --title "Legacy Launcher $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish draft release' }
